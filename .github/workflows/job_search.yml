name: Job Search Agent

on:
  schedule:
    - cron: "0 * * * *"  # every hour
  workflow_dispatch:       # manual trigger for testing

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job search agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BRIGHTDATA_PASSWORD: ${{ secrets.BRIGHTDATA_PASSWORD }}
        run: python main.py

      - name: Commit updated seen_jobs.xlsx
        run: |
          git config user.name "job-search-bot"
          git config user.email "bot@github-actions"
          git add seen_jobs.xlsx
          git diff --staged --quiet || git commit -m "chore: update seen_jobs [skip ci]"
          git push
