name: Job Search Agent

on:
  workflow_dispatch:       # triggered by Cloudflare Worker every hour

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Checkout tracker (seen_jobs)
        run: |
          git clone https://x-access-token:${{ secrets.GH_PAT }}@github.com/daddy4ka/job-search-data.git tracker_repo
          cp tracker_repo/seen_jobs.xlsx . 2>/dev/null || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install chromium --with-deps

      - name: Run job search agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BRIGHTDATA_USER: ${{ secrets.BRIGHTDATA_USER }}
          BRIGHTDATA_PASSWORD: ${{ secrets.BRIGHTDATA_PASSWORD }}
        run: python main.py

      - name: Push updated seen_jobs to tracker repo
        run: |
          cp seen_jobs.xlsx tracker_repo/
          cd tracker_repo
          git config user.name "job-search-bot"
          git config user.email "bot@github-actions"
          git add seen_jobs.xlsx
          git diff --staged --quiet || git commit -m "chore: update seen_jobs [skip ci]"
          git pull --rebase
          git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/daddy4ka/job-search-data.git main
